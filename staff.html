<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="icon" href="logo.webp"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f2a5f">
<title>SiamIT – นับสต๊อก</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><img class="hlogo" src="logo.webp" alt="Siam IT Thailand"><h1>นับสต๊อก<small id="who"></small></h1></div><button onclick="logout()">ออกจากระบบ</button></header>
<main id="main"></main><div id="toasts"></div>
<nav>
<button data-t="prod" class="on" onclick="go('prod')">นับสต๊อก</button>
<button data-t="hist" onclick="go('hist')">ประวัติของฉัน</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
let me, P = [], F = [], LG = null, q = '', sc = '', onlyLow = false, pending = false, catsList = [], tab = 'prod';
const dr = {};
const NOCAT = 'ไม่ระบุหมวด';
const catOf = p => String(p.category || '').trim() || NOCAT;
const isLow = p => stOf(p) !== 'ok';
(async () => {
  me = await guard(); if (!me) return;
  $('#who').textContent = me.name;
  await load();
  sb.channel('live').on('postgres_changes', { event: '*', schema: 'public' }, load).subscribe();
})();
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !!a.closest('#main'); };
addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) { pending = false; draw(); } }, 80));
async function load() {
  const [p, f] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('feedback').select('*').eq('user_id', me.id).order('created_at', { ascending: false })]);
  P = p.data || []; F = f.data || [];
  if (tab === 'hist') await loadMine();
  if (typing()) { pending = true; return; }
  draw();
}
function go(t) {
  tab = t; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'hist') { LG = null; draw(); loadMine().then(draw); } else draw();
  scrollTo(0, 0);
}
const draw = () => tab === 'hist' ? drawHist() : drawCount();
function drawCount() {
  const keep = ($('#fb') || {}).value || '';
  const nLow = P.filter(isLow).length;
  catsList = [...new Set(P.map(catOf))].sort((a, b) => a === NOCAT ? 1 : b === NOCAT ? -1 : a.localeCompare(b, 'th'));
  if (sc && !catsList.includes(sc)) sc = '';
  const chips = catsList.length > 1 || (catsList.length === 1 && catsList[0] !== NOCAT)
    ? `<div class="chips"><button class="chip ${sc ? '' : 'on'}" onclick="setSc(-1)">ทั้งหมด</button>${catsList.map((k, i) => `<button class="chip ${sc === k ? 'on' : ''}" onclick="setSc(${i})">${esc(k)}</button>`).join('')}</div>` : '';
  $('#main').innerHTML =
    `<button class="hero ${nLow ? 'bad' : 'ok'} ${onlyLow ? 'sel' : ''}" onclick="toggleLow()"><b>${nLow || '✓'}</b><span>${nLow ? 'รายการที่ต้องเติม' : 'สต๊อกครบทุกรายการ'}<small>${nLow ? (onlyLow ? 'แตะเพื่อดูสินค้าทั้งหมด' : 'แตะเพื่อดูเฉพาะที่ต้องเติม') : ''}</small></span></button>` +
    `<div class="tools"><input id="sq" type="search" placeholder="ค้นหาสินค้า" value="${esc(q)}" oninput="q=this.value;list()"></div>${chips}<div id="pl"></div>` + feedbackBox(F);
  list();
  if (keep) $('#fb').value = keep;
}
const setSc = i => { sc = i < 0 ? '' : catsList[i]; draw(); };
const toggleLow = () => { onlyLow = !onlyLow; draw(); };
function card(p) {
  const k = stOf(p), low = k !== 'ok', cn = catOf(p) !== NOCAT ? ' · ' + esc(catOf(p)) : '';
  const head = `<div class="row"><div><h3>${esc(p.name)}</h3><p class="mut">${isSt(p) ? 'สถานะในระบบ: ' + STL[p.status || 'ok'] : `ในระบบ ${fmtQ(p)} · ขั้นต่ำ ${p.min_qty}`}${cn}</p></div><div class="rt"><span class="tag ${TAGC[k]}">${LVN[k]}</span></div></div>`;
  if (isSt(p)) return `<article class="card ${low ? 'lv-' + k : ''}">${head}<div class="segs">${['ok', 'low', 'out'].map(s => `<button type="button" class="seg g-${s} ${(p.status || 'ok') === s ? 'on' : ''}" onclick="setStatus('${p.id}','${s}')">${STL[s]}</button>`).join('')}</div></article>`;
  if (isPk(p)) {
    const s = +p.pack_size, n = +p.qty, fl = Math.floor(n / s);
    const a = dr[p.id] ?? fl, b = dr['l' + p.id] ?? +(n - fl * s).toFixed(2);
    return `<article class="card ${low ? 'lv-' + k : ''}">${head}
    <div class="counter"><button type="button" class="step" onclick="adj('${p.id}',-1)" aria-label="ลดแพ็ค">−</button><input id="c${p.id}" type="number" min="0" step="1" inputmode="numeric" value="${a}" oninput="dr['${p.id}']=this.value"><button type="button" class="step" onclick="adj('${p.id}',1)" aria-label="เพิ่มแพ็ค">+</button><span class="mut">แพ็ค (แพ็คละ ${s} ${esc(p.unit)})</span></div>
    <div class="counter"><input id="l${p.id}" type="number" min="0" step="any" inputmode="decimal" value="${b}" oninput="dr['l${p.id}']=this.value"><span class="mut">${esc(p.unit)} เศษ</span><button class="btn" onclick="savePk('${p.id}')">บันทึกยอด</button></div></article>`;
  }
  const v = dr[p.id] ?? p.qty;
  return `<article class="card ${low ? 'lv-' + k : ''}">${head}
  <div class="counter"><button type="button" class="step" onclick="adj('${p.id}',-1)" aria-label="ลด">−</button><input id="c${p.id}" type="number" min="0" step="any" inputmode="decimal" value="${v}" oninput="dr['${p.id}']=this.value" aria-label="จำนวนที่นับได้"><button type="button" class="step" onclick="adj('${p.id}',1)" aria-label="เพิ่ม">+</button><button class="btn" onclick="save('${p.id}')">บันทึกยอด</button></div></article>`;
}
async function setStatus(id, s) {
  const p = P.find(x => x.id === id); if (p && (p.status || 'ok') === s) return;
  if (!ok(await sb.from('products').update({ status: s }).eq('id', id))) return;
  toast('บันทึกสถานะแล้ว'); load();
}
function list() {
  const s = q.trim().toLowerCase();
  const L = P.filter(p => (!sc || catOf(p) === sc) && (!onlyLow || isLow(p)) && (!s || String(p.name || '').toLowerCase().includes(s)));
  $('#pl').innerHTML = L.length ? L.map(card).join('') : `<p class="mut" style="text-align:center;margin:20px 0">${P.length ? 'ไม่พบสินค้า' : 'ยังไม่มีสินค้า'}</p>`;
}
function adj(id, d) { const i = $('#c' + id); const n = Math.max(0, (+i.value || 0) + d); i.value = dr[id] = +n.toFixed(2); }
async function save(id) {
  const i = $('#c' + id), v = i.value.trim(), p = P.find(x => x.id === id);
  if (v === '' || isNaN(+v) || +v < 0) return toast('กรอกจำนวนให้ถูกต้อง');
  if (p && +v === +p.qty) { delete dr[id]; return toast('ยอดเท่าเดิม'); }
  if (!ok(await sb.from('products').update({ qty: +v }).eq('id', id))) return;
  delete dr[id]; toast('บันทึกยอดแล้ว');
  if (document.activeElement) document.activeElement.blur();
  load();
}
async function savePk(id) {
  const p = P.find(x => x.id === id), a = +$('#c' + id).value || 0, b = +$('#l' + id).value || 0;
  if (a < 0 || b < 0) return toast('กรอกจำนวนให้ถูกต้อง');
  const t = +(a * +p.pack_size + b).toFixed(2);
  if (t === +p.qty) { delete dr[id]; delete dr['l' + id]; return toast('ยอดเท่าเดิม'); }
  if (!ok(await sb.from('products').update({ qty: t }).eq('id', id))) return;
  delete dr[id]; delete dr['l' + id]; toast(`บันทึกแล้ว = ${t} ${p.unit}`);
  if (document.activeElement) document.activeElement.blur();
  load();
}
function feedbackBox(F) {
  return `<article class="card"><h3>อยากให้เพิ่มหรือปรับอะไรไหม?</h3><p class="mut">บอกแอดมินได้ เช่น สินค้าที่ควรมีเพิ่ม หรือสิ่งที่ใช้แล้วไม่สะดวก</p><label style="margin-top:10px"><textarea id="fb" rows="3" placeholder="พิมพ์ความเห็นที่นี่"></textarea></label><button class="btn" onclick="sendFb()">ส่งความเห็น</button></article>` +
    F.slice(0, 5).map(x => `<article class="card"><div class="row"><p>${esc(x.message)}</p><span class="tag ${x.status === 'done' ? 'grn' : 'amb'}">${x.status === 'done' ? 'แอดมินอ่านแล้ว' : 'ส่งแล้ว'}</span></div></article>`).join('');
}
async function sendFb() {
  const m = $('#fb').value.trim(); if (!m) return toast('พิมพ์ความเห็นก่อนส่ง');
  if (ok(await sb.from('feedback').insert({ user_id: me.id, message: m }))) { $('#fb').value = ''; toast('ส่งให้แอดมินแล้ว'); load(); }
}
// ===== ประวัติของฉัน (30 วันล่าสุด) =====
async function loadMine() {
  const s = new Date(); s.setDate(s.getDate() - 30);
  const r = await sb.from('stock_logs').select('*').eq('user_id', me.id).gte('created_at', s.toISOString()).order('created_at', { ascending: false }).limit(500);
  LG = r.error ? [] : r.data || [];
}
const ACT = { qty: 'ปรับยอด', status: 'เปลี่ยนสถานะ', add: 'เพิ่มสินค้า', edit: 'แก้ข้อมูล', delete: 'ลบสินค้า' };
function myDesc(x) {
  const u = esc(x.unit || '');
  const pr = P.find(p => p.id === x.product_id || p.name === x.product_name);
  const ps = +(x.pack_size || (pr && pr.pack_size) || 0);
  if (x.action === 'qty') {
    const a = +x.old_value, b = +x.new_value, d = +(b - a).toFixed(2);
    let pkInfo = '';
    if (ps > 0) {
      const bPk = fmtPack(b, ps, u);
      const aPk = fmtPack(a, ps, u);
      pkInfo = `<span class="mut" style="display:block;font-size:13px;margin-top:2px">📦 รวมเป็น <b>${bPk}</b> <span style="opacity:.8">(จาก ${aPk} · แพ็คละ ${ps} ${u})</span></span>`;
    }
    return `${a} → <b>${b}</b> ${u}<span class="dlt ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : ''}${d}</span>${pkInfo}`;
  }
  if (x.action === 'status') return `${esc(STL[x.old_value] || x.old_value)} → <b>${esc(STL[x.new_value] || x.new_value)}</b>`;
  if (x.action === 'edit') return x.detail ? esc(x.detail).replace(/\n/g, '<br>') : 'แก้ไขข้อมูลสินค้า';
  return x.action === 'add' ? 'เพิ่มสินค้าใหม่' : 'ลบสินค้า';
}
function drawHist() {
  if (LG === null) { $('#main').innerHTML = '<p class="mut" style="text-align:center;margin:24px 0">กำลังโหลด...</p>'; return; }
  if (!LG.length) { $('#main').innerHTML = '<p class="mut" style="text-align:center;margin:24px 0">ยังไม่มีประวัติการนับของคุณใน 30 วันล่าสุด</p>'; return; }
  const days = {};
  LG.forEach(x => { const k = new Date(x.created_at).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short' }); (days[k] = days[k] || []).push(x); });
  $('#main').innerHTML = `<div class="hero ok"><b>${LG.length}</b><span>รายการที่คุณทำ<small>ย้อนหลัง 30 วัน</small></span></div>` +
    Object.keys(days).map(k => `<section class="card hday"><h3>${k} · ${days[k].length} รายการ</h3>${days[k].map(x => `<div class="hrow"><i class="hdot a-${esc(x.action)}"></i><div class="hbody"><div class="row"><h4>${esc(x.product_name)}</h4><span class="mut">${new Date(x.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</span></div><p class="hd">${myDesc(x)}</p><p class="mut">${esc(ACT[x.action] || x.action)}</p></div></div>`).join('')}</section>`).join('');
}
</script></body></html>
