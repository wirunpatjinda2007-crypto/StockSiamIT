<!doctype html><html lang="th"><head><meta charset="utf-8">

  <img class="logo" src="logo.webp" alt="Siam IT Thailand">
  <h1>SiamIT</h1>
  <p class="sub">เลือกประเภทผู้ใช้เพื่อเข้าสู่ระบบ</p>

  <a class="pick" href="#staff">

        <path d="M67 88H73L75 112L70 118L65 112Z" fill="#1f7bff"/>
        <circle cx="70" cy="42" r="22" fill="#f4dcd0"/>
        <path d="M48 40Q46 12 72 14Q98 15 92 40Q84 26 62 29Q52 31 48 40Z" fill="#1c2340"/>
        <path d="M78 98L134 90L122 126H74Z" fill="#b9c6df"/>
        <rect x="64" y="124" width="64" height="5" rx="2.5" fill="#1f2f63"/>
        <circle cx="104" cy="108" r="4" fill="#e8eefb"/>

    <div class="tx"><b>พนักงาน</b><span>ดูงานที่ได้รับและอัปเดตสต๊อก</span></div>
  </a>

  <a class="pick" href="#admin">
    <i class="ic" aria-hidden="true">
      <svg viewBox="0 0 170 130" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 130Q16 84 64 78Q112 84 114 130Z" fill="#1f2f63"/>
        <path d="M52 80L64 104L76 80Z" fill="#fff"/>
        <path d="M61 88H67L69 112L64 118L59 112Z" fill="#1f4fb8"/>
        <circle cx="64" cy="42" r="22" fill="#f4dcd0"/>
        <path d="M42 40Q40 12 66 14Q92 15 86 40Q78 26 56 29Q46 31 42 40Z" fill="#1c2340"/>
        <rect x="100" y="56" width="58" height="72" rx="7" fill="#1f4fb8"/>

        <rect x="116" y="49" width="26" height="12" rx="4" fill="#173a8a"/>
        <g fill="#2468e8"><rect x="111" y="76" width="8" height="8" rx="1.5"/><rect x="111" y="92" width="8" height="8" rx="1.5"/><rect x="111" y="108" width="8" height="8" rx="1.5"/></g>
        <g fill="#9db8e8"><rect x="123" y="78" width="24" height="4" rx="2"/><rect x="123" y="94" width="24" height="4" rx="2"/><rect x="123" y="110" width="24" height="4" rx="2"/></g>
        <circle cx="129" cy="26" r="17" fill="none" stroke="#2f7bff" stroke-width="7" stroke-dasharray="6 7.3"/>
        <circle cx="129" cy="26" r="15" fill="#2f7bff"/><circle cx="129" cy="26" r="7" fill="#fff"/>
      </svg>

    <div class="tx"><b>แอดมิน</b><span>ดูของที่ขาดและมอบหมายงาน</span></div>
  </a>

  <div class="foot">
    <div class="line"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#0f2a5f" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 12l8.5-4.7M12 12L3.5 7.3M12 12v9.5"/></svg><b>SiamIT Stock Management System</b></div>
    <small>จัดการสต็อกอย่างมืออาชีพ ด้วยระบบที่ทันสมัย</small>
  </div>
</div>

<form id="f" hidden><a class="back" href="#">← เปลี่ยนประเภท</a>
<h1 id="t"></h1><p id="p"></p>
<label>อีเมล<input name="email" type="email" required autocomplete="username" inputmode="email"></label>
<label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn">เข้าสู่ระบบ</button></form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
// ข้อความหัวฟอร์มของแต่ละประเภทผู้ใช้ - แก้คำได้ตรงนี้
const L = { admin: ['เข้าสู่ระบบแอดมิน', 'ดูของที่ขาดและมอบหมายงาน'], staff: ['เข้าสู่ระบบพนักงาน', 'ดูงานที่ได้รับและอัปเดตสต๊อก'] };
// role มาจากลิงก์: #staff หรือ #admin
let role = '';
// สลับระหว่างหน้าเลือกประเภท กับฟอร์มล็อกอิน
function show() {
  role = location.hash.slice(1); if (!L[role]) role = '';
  $('#pick').hidden = !!role; $('#f').hidden = !role;
  if (role) { $('#t').textContent = L[role][0]; $('#p').textContent = L[role][1]; }
}
addEventListener('hashchange', show); show();
// ล็อกอินแล้วไปหน้าของตัวเอง: แอดมิน -> admin.html, พนักงาน -> staff.html
const go = p => location.replace(p.role === 'admin' ? 'admin.html' : 'staff.html');
profile().then(p => p && go(p));
// กดเข้าสู่ระบบ: เช็กอีเมล/รหัส แล้วเช็กว่าบัญชีตรงกับประเภทที่เลือก
$('#f').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword(Object.fromEntries(new FormData(e.target)));
  if (error) return toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
  const p = await profile();
  if (p.role !== role) { await sb.auth.signOut(); return toast(role === 'admin' ? 'บัญชีนี้ไม่ใช่แอดมิน ให้เข้าทางพนักงาน' : 'บัญชีนี้เป็นแอดมิน ให้เข้าทางแอดมิน'); }
  go(p);
};
</script></body></html>
